services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env.digitalocean
    expose:
      - "8080"
    # Untuk testing tanpa domain/Caddy, buka port langsung dengan:
    # ports:
    #   - "8080:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
